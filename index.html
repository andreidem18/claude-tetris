<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <label class="theme-switch" title="Modo claro/oscuro">
      <input type="checkbox" id="theme-toggle" />
      <span class="slider"></span>
    </label>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <button id="view-records-btn" class="view-records-btn">Ver Records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="top-indicator"></p>
        <div id="name-input-container" class="hidden">
          <input type="text" id="player-name" placeholder="Tu nombre" maxlength="20" />
          <button id="save-record-btn">Guardar Record</button>
        </div>
        <div id="records-table-container" class="hidden">
          <h3>TOP 5</h3>
          <table id="records-table">
            <tbody></tbody>
          </table>
          <button id="reset-records-btn">Limpiar Records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="records-modal" class="modal hidden">
      <div class="modal-content">
        <h2>TOP RECORDS</h2>
        <table id="modal-records-table">
          <tbody></tbody>
        </table>
        <div class="modal-stats">
          <p><strong>Mejor combo:</strong> <span id="best-combo">0</span> líneas</p>
          <p><strong>Máximo nivel:</strong> <span id="max-level">1</span></p>
        </div>
        <button id="close-modal-btn">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
